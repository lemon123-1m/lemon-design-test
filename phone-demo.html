<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>戳一戳 - 手机界面动效</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background: #f4f6f8;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    .demo {
      display: grid;
      width: 100%;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
    }

    .phone {
      position: relative;
      width: min(393px, calc(100vw - 32px), calc((100svh - 48px) * .46127));
      aspect-ratio: 393 / 852;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .1);
      border-radius: clamp(28px, 8vw, 44px);
      background: #fff;
      box-shadow:
        0 24px 64px rgba(29, 44, 59, .18),
        0 3px 12px rgba(29, 44, 59, .1);
      isolation: isolate;
    }

    .phone::after {
      position: absolute;
      z-index: 20;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .screen-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .poke-button {
      position: absolute;
      z-index: 10;
      top: 55.3%;
      left: 74.5%;
      width: 19.3%;
      height: 4.6%;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .poke-button:focus-visible {
      outline: 2px solid #e52651;
      outline-offset: 2px;
    }

    .row-pulse {
      position: absolute;
      z-index: 2;
      top: 56.08%;
      left: 16.9%;
      width: 75.7%;
      height: 3.02%;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
    }

    .hand {
      position: absolute;
      z-index: 12;
      top: 57.55%;
      left: 77.6%;
      width: 10.2%;
      aspect-ratio: 1;
      opacity: 0;
      pointer-events: none;
      transform: translate(155%, -50%) scale(.82) rotate(-8deg);
      transform-origin: 18% 50%;
      filter: drop-shadow(0 4px 6px rgba(229, 38, 81, .16));
    }

    .hand img {
      display: block;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .impact {
      position: absolute;
      z-index: 11;
      top: 57.55%;
      left: 79.45%;
      width: 6%;
      aspect-ratio: 1;
      border: max(1px, .12vw) solid rgba(229, 38, 81, .78);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.18);
    }

    .phone.is-poking .hand {
      animation: poke-left 1.35s cubic-bezier(.22, .8, .22, 1) both;
    }

    .phone.is-poking .impact {
      animation: impact-ring .68s .42s ease-out both;
    }

    .phone.is-poking .row-pulse {
      animation: row-confirm .72s .38s ease-out both;
    }

    @keyframes poke-left {
      0% {
        opacity: 0;
        transform: translate(155%, -50%) scale(.82) rotate(-8deg);
      }
      12% {
        opacity: 1;
        transform: translate(118%, -50%) scale(.9) rotate(-5deg);
      }
      38% {
        opacity: 1;
        transform: translate(8%, -50%) scale(1.04, .96) rotate(2deg);
      }
      47% {
        opacity: 1;
        transform: translate(-7%, -50%) scale(1.1, .9) rotate(4deg);
      }
      61% {
        opacity: 1;
        transform: translate(24%, -50%) scale(.94, 1.06) rotate(-3deg);
      }
      79% {
        opacity: 1;
        transform: translate(7%, -50%) scale(1.01) rotate(1deg);
      }
      100% {
        opacity: 0;
        transform: translate(18%, -50%) scale(.98) rotate(0);
      }
    }

    @keyframes impact-ring {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.18); }
      14% { opacity: .86; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.75); }
    }

    @keyframes row-confirm {
      0% { opacity: 0; background: rgba(229, 38, 81, 0); }
      28% { opacity: 1; background: rgba(229, 38, 81, .1); }
      100% { opacity: 0; background: rgba(229, 38, 81, 0); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .demo { padding: 0; }

      .phone {
        width: min(100vw, calc(100svh * .46127));
        border-color: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone.is-poking .hand,
      .phone.is-poking .impact,
      .phone.is-poking .row-pulse {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <section class="phone" aria-label="小红书评论页手机界面">
      <img class="screen-art" src="assets/phone/reference.jpeg" alt="小红书评论页，评论中展示交集标签与戳一戳入口">
      <span class="row-pulse" aria-hidden="true"></span>
      <span class="impact" aria-hidden="true"></span>
      <span class="hand" aria-hidden="true"><img src="assets/poke-hand.svg" alt=""></span>
      <button class="poke-button" type="button" aria-label="播放戳一戳动效">
        <span class="sr-only">戳一戳</span>
      </button>
    </section>
  </main>

  <script>
    const phone = document.querySelector('.phone');
    const pokeButton = document.querySelector('.poke-button');
    let motionTimer;
    let autoTimer;

    const playPoke = () => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      window.clearTimeout(motionTimer);
      phone.classList.remove('is-poking');
      void phone.offsetWidth;
      phone.classList.add('is-poking');
      motionTimer = window.setTimeout(() => phone.classList.remove('is-poking'), 1380);
    };

    pokeButton.addEventListener('click', () => {
      window.clearTimeout(autoTimer);
      playPoke();
    });

    window.addEventListener('load', () => {
      autoTimer = window.setTimeout(playPoke, 480);
    }, { once: true });
  </script>
</body>
</html>
