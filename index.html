<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>交集 - 作品展示</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background: #fff;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateX(4%);
      transition: opacity .4s ease, transform .5s cubic-bezier(.22, .8, .22, 1), visibility 0s .5s;
      background: #fff;
      pointer-events: none;
    }

    .slide.is-active {
      z-index: 1;
      opacity: 1;
      visibility: visible;
      transform: translateX(0);
      transition-delay: 0s;
      pointer-events: auto;
    }

    .slide.is-before { transform: translateX(-4%); }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .interactive-canvas {
      position: relative;
      width: min(100vw, calc(100svh * 16 / 9));
      aspect-ratio: 16 / 9;
    }

    .interactive-canvas > img {
      position: absolute;
      inset: 0;
    }

    .phone-demo {
      position: absolute;
      z-index: 2;
      top: 7.5%;
      right: 22.5%;
      width: 21.2%;
      aspect-ratio: 393 / 852;
      overflow: hidden;
      border: 0;
      border-radius: 8.5% / 4%;
      background: transparent;
      filter: drop-shadow(0 18px 28px rgba(35, 55, 75, .16));
    }

    .hover-zone {
      position: fixed;
      z-index: 5;
      top: 0;
      bottom: 0;
      width: 22vw;
    }

    .hover-zone--prev { left: 0; }
    .hover-zone--next { right: 0; }

    .page-turn {
      position: absolute;
      top: 50%;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 50%;
      opacity: 0;
      transform: translateY(-50%) scale(.86);
      background: rgba(255, 255, 255, .8);
      color: rgba(17, 17, 17, .68);
      box-shadow: 0 8px 30px rgba(30, 55, 80, .12);
      font: 400 25px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .hover-zone--prev .page-turn { left: 24px; }
    .hover-zone--next .page-turn { right: 24px; }

    .hover-zone:hover .page-turn,
    .page-turn:focus-visible {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .page-turn:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .page-turn:disabled { display: none; }

    .page-nav {
      position: fixed;
      z-index: 10;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      display: flex;
      gap: 7px;
      align-items: center;
      padding: 9px 10px;
      transform: translateX(-50%);
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 999px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 8px 30px rgba(30, 55, 80, .1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .page-nav button {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(0, 0, 0, .5);
      font: 600 11px/1 inherit;
      cursor: pointer;
      transition: color .18s ease, background-color .18s ease, transform .18s ease;
    }

    .page-nav button:hover,
    .page-nav button:focus-visible,
    .page-nav button[aria-current="page"] {
      color: #fff;
      background: #111;
      outline: none;
      transform: scale(1.08);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      .page-nav {
        bottom: max(10px, env(safe-area-inset-bottom));
        gap: 3px;
        padding: 7px 8px;
      }

      .page-nav button {
        width: 23px;
        height: 23px;
        font-size: 10px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .slide,
      .page-nav button,
      .page-turn {
        transition: none;
      }

    }
  </style>
</head>
<body>
  <main class="deck" aria-live="polite">
    <figure class="slide" id="p1"><img src="assets/1.jpg?v=2" alt="第 1 页：交集，让陌生互动不再从零开始" fetchpriority="high"><figcaption class="sr-only">第 1 页</figcaption></figure>
    <figure class="slide" id="p2"><img src="assets/2.jpg" alt="第 2 页：为什么需要轻社交"><figcaption class="sr-only">第 2 页</figcaption></figure>
    <figure class="slide" id="p3"><img src="assets/3.jpg?v=2" alt="第 3 页：交集，你们都在准备同一件事"><figcaption class="sr-only">第 3 页</figcaption></figure>
    <figure class="slide" id="p4"><img src="assets/4.jpg" alt="第 4 页：从一次点击到一次关系"><figcaption class="sr-only">第 4 页</figcaption></figure>
    <figure class="slide" id="p5"><img src="assets/5.jpg" alt="第 5 页：设计原则与方案机制"><figcaption class="sr-only">第 5 页</figcaption></figure>
    <figure class="slide" id="p6"><img src="assets/6.jpg?v=2" alt="第 6 页：我找人 A-B"><figcaption class="sr-only">第 6 页</figcaption></figure>
    <figure class="slide slide--interactive" id="p7">
      <div class="interactive-canvas">
        <img src="assets/7.jpg?v=2" alt="第 7 页：Coding 戳一戳">
        <iframe class="phone-demo" src="phone-demo.html?embed=1&amp;v=26" title="戳一戳交互演示" loading="eager"></iframe>
      </div>
      <figcaption class="sr-only">第 7 页，可操作的戳一戳手机界面演示</figcaption>
    </figure>
    <figure class="slide" id="p8"><img src="assets/8.jpg" alt="第 8 页：我被戳一戳 B-A"><figcaption class="sr-only">第 8 页</figcaption></figure>
    <figure class="slide" id="p9"><img src="assets/9.jpg?v=2" alt="第 9 页：从轻互动到深交流"><figcaption class="sr-only">第 9 页</figcaption></figure>
    <figure class="slide" id="p10"><img src="assets/10.jpg" alt="第 10 页：二期迭代"><figcaption class="sr-only">第 10 页</figcaption></figure>
  </main>

  <div class="hover-zone hover-zone--prev"><button class="page-turn page-turn--prev" type="button" aria-label="上一页">‹</button></div>
  <div class="hover-zone hover-zone--next"><button class="page-turn page-turn--next" type="button" aria-label="下一页">›</button></div>

  <nav class="page-nav" aria-label="页面导航">
    <button type="button" data-page="0" aria-label="第 1 页">1</button>
    <button type="button" data-page="1" aria-label="第 2 页">2</button>
    <button type="button" data-page="2" aria-label="第 3 页">3</button>
    <button type="button" data-page="3" aria-label="第 4 页">4</button>
    <button type="button" data-page="4" aria-label="第 5 页">5</button>
    <button type="button" data-page="5" aria-label="第 6 页">6</button>
    <button type="button" data-page="6" aria-label="第 7 页">7</button>
    <button type="button" data-page="7" aria-label="第 8 页">8</button>
    <button type="button" data-page="8" aria-label="第 9 页">9</button>
    <button type="button" data-page="9" aria-label="第 10 页">10</button>
  </nav>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const pageButtons = [...document.querySelectorAll('.page-nav button')];
    const prevButton = document.querySelector('.page-turn--prev');
    const nextButton = document.querySelector('.page-turn--next');
    const phoneDemo = document.querySelector('.phone-demo');
    const hashIndex = slides.findIndex((slide) => `#${slide.id}` === location.hash);
    let current = hashIndex >= 0 ? hashIndex : 0;
    let locked = false;

    const showPage = (nextIndex) => {
      const bounded = Math.min(slides.length - 1, Math.max(0, nextIndex));
      if (bounded === current && slides[current].classList.contains('is-active')) return;

      slides.forEach((slide, index) => {
        slide.classList.toggle('is-active', index === bounded);
        slide.classList.toggle('is-before', index < bounded);
      });

      pageButtons.forEach((button, index) => {
        if (index === bounded) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });

      current = bounded;
      prevButton.disabled = current === 0;
      nextButton.disabled = current === slides.length - 1;
      history.replaceState(null, '', `#p${current + 1}`);
      document.title = `交集 - 第 ${current + 1} 页`;

      if (current === 6) {
        window.setTimeout(() => {
          phoneDemo.contentWindow?.postMessage('restart-poke-guide', '*');
        }, 120);
      }
    };

    const turn = (direction) => {
      if (locked) return;
      showPage(current + direction);
      locked = true;
      window.setTimeout(() => { locked = false; }, 520);
    };

    prevButton.addEventListener('click', () => turn(-1));
    nextButton.addEventListener('click', () => turn(1));
    pageButtons.forEach((button) => {
      button.addEventListener('click', () => showPage(Number(button.dataset.page)));
    });

    document.addEventListener('keydown', (event) => {
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        turn(1);
      }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        turn(-1);
      }
      if (event.key === 'Home') showPage(0);
      if (event.key === 'End') showPage(slides.length - 1);
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    document.addEventListener('touchend', (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 48) turn(delta < 0 ? 1 : -1);
    }, { passive: true });

    phoneDemo.addEventListener('load', () => {
      if (current === 6) phoneDemo.contentWindow?.postMessage('restart-poke-guide', '*');
    });

    showPage(current);
  </script>
</body>
</html>
