<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>戳一戳 - 手机界面动效</title>
  <script>
    if (new URLSearchParams(location.search).has('embed')) {
      document.documentElement.classList.add('is-embedded');
    }
  </script>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      background: #f4f6f8;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    html.is-embedded,
    html.is-embedded body {
      min-height: 100%;
      background: transparent;
    }

    .demo {
      display: grid;
      width: 100%;
      min-height: 100svh;
      place-items: center;
      padding: 24px;
    }

    .phone {
      position: relative;
      width: min(393px, calc(100vw - 32px), calc((100svh - 48px) * .46127));
      aspect-ratio: 393 / 852;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .1);
      border-radius: clamp(28px, 8vw, 44px);
      background: #fff;
      box-shadow:
        0 24px 64px rgba(29, 44, 59, .18),
        0 3px 12px rgba(29, 44, 59, .1);
      container-type: inline-size;
      isolation: isolate;
    }

    .phone::after {
      position: absolute;
      z-index: 20;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .screen-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .recipient-avatar {
      position: absolute;
      z-index: 8;
      top: 52.82%;
      left: 2.29%;
      display: block;
      width: 12.72%;
      aspect-ratio: 1;
      object-fit: cover;
      pointer-events: none;
      transform-origin: 50% 68%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .poke-icon {
      position: absolute;
      z-index: 10;
      top: 56.38%;
      left: 76.9%;
      display: grid;
      width: 5.1%;
      aspect-ratio: 1;
      place-items: center;
      overflow: visible;
      pointer-events: none;
      transform-origin: 12% 50%;
    }

    .poke-icon::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: #fff1f4;
      content: "";
    }

    .poke-icon img {
      position: absolute;
      display: block;
      width: 84%;
      height: 84%;
      object-fit: contain;
    }

    .icon-outline {
      transform: scaleX(-1);
      transition: opacity .2s ease, transform .2s ease;
    }

    .icon-filled {
      opacity: 0;
      transform: scale(.45);
      transition: opacity .2s ease, transform .2s ease;
    }

    .poke-target {
      position: absolute;
      z-index: 20;
      top: 55.92%;
      left: 75.2%;
      width: 17.8%;
      height: 3.55%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .poke-target:focus-visible {
      outline: 2px solid #e52651;
      outline-offset: 2px;
    }

    .intersection-target {
      position: absolute;
      z-index: 20;
      top: 55.92%;
      left: 17.1%;
      width: 57.5%;
      height: 3.55%;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .intersection-target:focus-visible {
      outline: 2px solid #3d8bf2;
      outline-offset: 2px;
    }

    .sheet-layer {
      position: absolute;
      z-index: 40;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sheet-scrim {
      position: absolute;
      inset: 0;
      border: 0;
      opacity: 0;
      background: rgba(0, 0, 0, .2);
      cursor: default;
      transition: opacity .24s ease;
    }

    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 42.84%;
      overflow: hidden;
      border-radius: 8.15cqw 8.15cqw 0 0;
      transform: translateY(102%);
      transition: transform .38s cubic-bezier(.22, .8, .22, 1);
      will-change: transform;
    }

    .sheet-art {
      position: absolute;
      bottom: 0;
      left: 0;
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .ask-target {
      position: absolute;
      z-index: 2;
      right: 4.1%;
      bottom: 11.2%;
      width: 44.4%;
      height: 11%;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ask-target:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -4px;
    }

    .profile-target {
      position: absolute;
      z-index: 2;
      bottom: 11.2%;
      left: 4.1%;
      width: 44.4%;
      height: 11%;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .profile-target:focus-visible {
      outline: 2px solid #111;
      outline-offset: -4px;
    }

    .chat-page {
      position: absolute;
      z-index: 50;
      inset: 0;
      overflow: hidden;
      background: #fff;
      transform: translateX(102%);
      transition: transform .38s cubic-bezier(.22, .8, .22, 1);
      will-change: transform;
    }

    .chat-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .chat-back {
      position: absolute;
      z-index: 2;
      top: 5.1%;
      left: 0;
      width: 14%;
      height: 7.2%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .chat-back:focus-visible {
      outline: 2px solid #111;
      outline-offset: -5px;
    }

    .chat-card-mask {
      position: absolute;
      z-index: 1;
      top: 17.6%;
      right: 3.05%;
      left: 3.05%;
      height: 16.1%;
      opacity: 0;
      background: #fff;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .chat-card-close {
      position: absolute;
      z-index: 3;
      top: 17.35%;
      right: 2.5%;
      width: 12%;
      height: 6%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .chat-card-close:focus-visible {
      outline: 2px solid #111;
      outline-offset: -7px;
    }

    .chat-suggestion-target {
      position: absolute;
      z-index: 3;
      top: 28.8%;
      left: 5.6%;
      width: 60.5%;
      height: 4.35%;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .chat-suggestion-target:focus-visible {
      outline: 2px solid #3d8bf2;
      outline-offset: 1px;
    }

    .chat-compose-input {
      position: absolute;
      z-index: 3;
      bottom: 4.95%;
      left: 13.7%;
      width: 61.5%;
      height: 5.15%;
      padding: 0 2px;
      border: 0;
      outline: 0;
      background: #f5f5f5;
      color: rgba(0, 0, 0, .8);
      font: 400 4.071cqw/6.107cqw -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      text-overflow: clip;
      white-space: nowrap;
    }

    .chat-compose-input::placeholder { color: #999; }

    .chat-compose-input:focus-visible {
      border-radius: 4px;
      outline: 2px solid rgba(61, 139, 242, .55);
      outline-offset: 1px;
    }

    .chat-page.is-card-dismissed .chat-card-mask { opacity: 1; }
    .chat-page.is-card-dismissed .chat-suggestion-target { display: none; }

    .profile-page {
      position: absolute;
      z-index: 50;
      inset: 0;
      overflow: hidden;
      background: #fff;
      transform: translateX(102%);
      transition: transform .38s cubic-bezier(.22, .8, .22, 1);
      will-change: transform;
    }

    .profile-art {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .profile-back {
      position: absolute;
      z-index: 2;
      top: 5.4%;
      left: 0;
      width: 14%;
      height: 7.2%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .profile-back:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -5px;
    }

    .phone.is-sheet-open .sheet-layer { pointer-events: auto; }
    .phone.is-sheet-open .sheet-scrim { opacity: 1; }
    .phone.is-sheet-open .bottom-sheet { transform: translateY(0); }
    .phone.is-chat-open .chat-page { transform: translateX(0); }
    .phone.is-profile-open .profile-page { transform: translateX(0); }

    .poke-label {
      position: absolute;
      z-index: 11;
      top: 56.42%;
      left: calc(81.35% + 2px);
      display: grid;
      width: 11.7%;
      height: 2.35%;
      place-items: center start;
      overflow: hidden;
      background: #fff1f4;
      color: #e52651;
      font-size: clamp(8px, 3.05cqw, 12px);
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .poke-label span {
      position: absolute;
      left: 0;
      transition: opacity .2s ease, transform .2s ease;
    }

    .label-done { opacity: 0; }

    .particle {
      --angle: 0deg;
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 6px;
      border-radius: 999px;
      opacity: 0;
      background: #ff2442;
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-4px) scaleY(.45);
      transform-origin: 50% 50%;
    }

    .particle:nth-of-type(1) { --angle: 0deg; }
    .particle:nth-of-type(2) { --angle: 45deg; height: 4px; }
    .particle:nth-of-type(3) { --angle: 90deg; }
    .particle:nth-of-type(4) { --angle: 135deg; height: 4px; }
    .particle:nth-of-type(5) { --angle: 180deg; }
    .particle:nth-of-type(6) { --angle: 225deg; height: 4px; }
    .particle:nth-of-type(7) { --angle: 270deg; }
    .particle:nth-of-type(8) { --angle: 315deg; height: 4px; }

    .phone.is-guiding .poke-icon {
      animation: icon-poke 2.2s ease-in-out 3;
    }

    .phone.is-avatar-wobbling .recipient-avatar {
      animation: avatar-wobble .74s cubic-bezier(.36, .08, .25, 1) both;
    }

    .phone.is-bursting .icon-outline {
      animation: outline-collapse .9s cubic-bezier(.36, .05, .3, 1) both;
    }

    .phone.is-bursting .icon-filled {
      animation: filled-pop .9s cubic-bezier(.22, .8, .22, 1) both;
    }

    .phone.is-bursting .particle {
      animation: particle-burst .72s .25s cubic-bezier(.18, .72, .24, 1) both;
    }

    .phone.is-bursting .label-idle {
      animation: label-out .9s ease both;
    }

    .phone.is-bursting .label-done {
      animation: label-in .9s ease both;
    }

    .phone.is-filled .icon-outline { opacity: 0; }

    .phone.is-filled .icon-filled {
      opacity: 1;
      transform: scale(1);
    }

    .phone.is-filled .label-idle { opacity: 0; }
    .phone.is-filled .label-done { opacity: 1; }

    .phone.is-reverting .icon-filled {
      animation: filled-collapse .58s cubic-bezier(.42, 0, .58, 1) both;
    }

    .phone.is-reverting .icon-outline {
      animation: outline-return .58s cubic-bezier(.22, .76, .32, 1) both;
    }

    .phone.is-reverting .label-done {
      animation: revert-label-out .58s ease both;
    }

    .phone.is-reverting .label-idle {
      animation: revert-label-in .58s ease both;
    }

    @keyframes icon-poke {
      0%, 14%, 18%, 32%, 100% {
        transform: translateX(0) scale(1);
      }
      7% {
        transform: translateX(-11%) scaleX(1.06) scaleY(.98);
      }
      25% {
        transform: translateX(-11%) scaleX(1.06) scaleY(.98);
      }
    }

    @keyframes avatar-wobble {
      0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
      18% { transform: translateX(-1.5%) rotate(-4deg) scale(1.015); }
      38% { transform: translateX(1.2%) rotate(3.4deg) scale(1.015); }
      58% { transform: translateX(-.7%) rotate(-2.2deg) scale(1.008); }
      76% { transform: translateX(.4%) rotate(1.2deg) scale(1.004); }
    }

    @keyframes outline-collapse {
      0% { opacity: 1; transform: scaleX(-1) scale(1); }
      20% { opacity: 1; transform: scaleX(-1) scale(.74); }
      32% { opacity: 0; transform: scaleX(-1) scale(.3); }
      100% { opacity: 0; transform: scaleX(-1) scale(.3); }
    }

    @keyframes filled-pop {
      0%, 28% { opacity: 0; transform: scale(.28); }
      38% { opacity: 1; transform: scale(1.26); }
      56% { opacity: 1; transform: scale(.92); }
      72% { opacity: 1; transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes filled-collapse {
      0% { opacity: 1; transform: scale(1); }
      32% { opacity: 1; transform: scale(.68); }
      46%, 100% { opacity: 0; transform: scale(.3); }
    }

    @keyframes outline-return {
      0%, 36% { opacity: 0; transform: scaleX(-1) scale(.38); }
      48% { opacity: 1; transform: scaleX(-1) scale(1.14); }
      72% { opacity: 1; transform: scaleX(-1) scale(.96); }
      100% { opacity: 1; transform: scaleX(-1) scale(1); }
    }

    @keyframes particle-burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-4px) scaleY(.45);
      }
      18% { opacity: 1; }
      58% {
        opacity: .9;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-14px) scaleY(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-20px) scaleY(.2);
      }
    }

    @keyframes label-out {
      0%, 27% { opacity: 1; transform: scale(1); }
      36%, 100% { opacity: 0; transform: scale(.84); }
    }

    @keyframes label-in {
      0%, 31% { opacity: 0; transform: scale(.84); }
      40% { opacity: 1; transform: scale(1.08); }
      60%, 100% { opacity: 1; transform: scale(1); }
    }

    @keyframes revert-label-out {
      0%, 30% { opacity: 1; transform: scale(1); }
      42%, 100% { opacity: 0; transform: scale(.86); }
    }

    @keyframes revert-label-in {
      0%, 38% { opacity: 0; transform: scale(.86); }
      52% { opacity: 1; transform: scale(1.06); }
      72%, 100% { opacity: 1; transform: scale(1); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .demo { padding: 0; }

      .phone {
        width: min(100vw, calc(100svh * .46127));
        border-color: transparent;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::after { display: none; }

      html.is-embedded .demo {
        min-height: 100%;
        padding: 0;
      }

      html.is-embedded .phone {
        width: 100%;
        border: 1px solid rgba(0, 0, 0, .1);
        border-radius: 9cqw;
        box-shadow: none;
      }

      html.is-embedded .phone::after { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone.is-guiding .poke-icon {
        animation: none;
      }

      .phone.is-avatar-wobbling .recipient-avatar {
        animation: none;
      }

      .phone.is-bursting .icon-outline,
      .phone.is-bursting .icon-filled,
      .phone.is-bursting .particle,
      .phone.is-bursting .label-idle,
      .phone.is-bursting .label-done,
      .phone.is-reverting .icon-outline,
      .phone.is-reverting .icon-filled,
      .phone.is-reverting .label-idle,
      .phone.is-reverting .label-done {
        animation: none;
      }

      .sheet-scrim,
      .bottom-sheet,
      .chat-page,
      .profile-page,
      .chat-card-mask {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="demo">
    <section class="phone" aria-label="小红书评论页手机界面">
      <img class="screen-art" src="assets/phone/reference.jpeg?v=3" alt="小红书评论页，评论中展示交集标签与戳一戳入口">
      <img class="recipient-avatar" src="assets/phone/avatar-install.jpg" alt="" aria-hidden="true">
      <span class="poke-icon" aria-hidden="true">
        <img class="icon-outline" src="assets/poke-hand.svg" alt="">
        <img class="icon-filled" src="assets/phone/poke-filled.png" alt="">
        <i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i>
        <i class="particle"></i><i class="particle"></i><i class="particle"></i><i class="particle"></i>
      </span>
      <span class="poke-label" aria-hidden="true">
        <span class="label-idle">戳一戳</span>
        <span class="label-done">已戳</span>
      </span>
      <button class="intersection-target" type="button" aria-label="查看共同交集" aria-expanded="false"></button>
      <button class="poke-target" type="button" aria-label="戳一戳"></button>
      <div class="sheet-layer" aria-hidden="true" inert>
        <button class="sheet-scrim" type="button" aria-label="关闭交集详情"></button>
        <section class="bottom-sheet" role="dialog" aria-label="共同交集详情" aria-modal="true">
          <img class="sheet-art" src="assets/phone/intersection-sheet-full.jpeg" alt="你们不止这一处相同：上海跨区搬家和日本大阪环球影城旅行">
          <button class="profile-target" type="button" aria-label="查看主页"></button>
          <button class="ask-target" type="button" aria-label="问问 TA"></button>
        </section>
      </div>
      <section class="chat-page" aria-label="与安装小能手的私信" aria-hidden="true" inert>
        <img class="chat-art" src="assets/phone/chat-page.jpeg?v=3" alt="与安装小能手的私信页面">
        <span class="chat-card-mask" aria-hidden="true"></span>
        <button class="chat-suggestion-target" type="button" aria-label="使用推荐问题：楼层费和停车距离一般怎么收费？"></button>
        <button class="chat-card-close" type="button" aria-label="关闭共同经历卡片"></button>
        <button class="chat-back" type="button" aria-label="返回评论页"></button>
        <input class="chat-compose-input" type="text" placeholder="发消息..." aria-label="私信内容">
      </section>
      <section class="profile-page" aria-label="安装小能手的个人主页" aria-hidden="true" inert>
        <img class="profile-art" src="assets/phone/profile-page.jpeg?v=3" alt="安装小能手的个人主页">
        <button class="profile-back" type="button" aria-label="返回评论页"></button>
      </section>
    </section>
  </main>

  <script>
    const phone = document.querySelector('.phone');
    const pokeIcon = document.querySelector('.poke-icon');
    const recipientAvatar = document.querySelector('.recipient-avatar');
    const pokeTarget = document.querySelector('.poke-target');
    const intersectionTarget = document.querySelector('.intersection-target');
    const sheetLayer = document.querySelector('.sheet-layer');
    const sheetScrim = document.querySelector('.sheet-scrim');
    const profileTarget = document.querySelector('.profile-target');
    const askTarget = document.querySelector('.ask-target');
    const chatPage = document.querySelector('.chat-page');
    const chatBack = document.querySelector('.chat-back');
    const chatCardClose = document.querySelector('.chat-card-close');
    const chatSuggestionTarget = document.querySelector('.chat-suggestion-target');
    const chatComposeInput = document.querySelector('.chat-compose-input');
    const profilePage = document.querySelector('.profile-page');
    const profileBack = document.querySelector('.profile-back');
    let burstTimer;

    const startGuide = () => {
      if (phone.classList.contains('is-filled') ||
          phone.classList.contains('is-bursting') ||
          phone.classList.contains('is-reverting')) return;

      phone.classList.remove('is-guiding');
      void phone.offsetWidth;
      phone.classList.add('is-guiding');
    };

    pokeIcon.addEventListener('animationend', (event) => {
      if (event.animationName === 'icon-poke') phone.classList.remove('is-guiding');
    });

    recipientAvatar.addEventListener('animationend', (event) => {
      if (event.animationName === 'avatar-wobble') phone.classList.remove('is-avatar-wobbling');
    });

    pokeTarget.addEventListener('click', () => {
      window.clearTimeout(burstTimer);

      if (phone.classList.contains('is-bursting') || phone.classList.contains('is-reverting')) return;

      if (phone.classList.contains('is-filled')) {
        phone.classList.remove('is-guiding', 'is-bursting');
        phone.classList.add('is-reverting');
        pokeTarget.setAttribute('aria-label', '正在撤回戳一戳');

        burstTimer = window.setTimeout(() => {
          phone.classList.remove('is-filled', 'is-reverting');
          pokeTarget.setAttribute('aria-label', '戳一戳');
        }, 600);
        return;
      }

      pokeTarget.setAttribute('aria-label', '戳一戳');
      phone.classList.remove('is-guiding', 'is-bursting', 'is-filled', 'is-avatar-wobbling');
      void phone.offsetWidth;
      phone.classList.add('is-bursting', 'is-avatar-wobbling');

      burstTimer = window.setTimeout(() => {
        phone.classList.remove('is-bursting');
        phone.classList.add('is-filled');
        pokeTarget.setAttribute('aria-label', '已戳');
      }, 930);
    });

    const setSheetOpen = (open) => {
      phone.classList.toggle('is-sheet-open', open);
      intersectionTarget.setAttribute('aria-expanded', String(open));
      sheetLayer.setAttribute('aria-hidden', String(!open));
      sheetLayer.inert = !open;
      if (open) phone.classList.remove('is-guiding');
    };

    intersectionTarget.addEventListener('click', () => setSheetOpen(true));
    sheetScrim.addEventListener('click', () => setSheetOpen(false));

    const setChatOpen = (open) => {
      phone.classList.toggle('is-chat-open', open);
      chatPage.setAttribute('aria-hidden', String(!open));
      chatPage.inert = !open;
      if (open) {
        chatPage.classList.remove('is-card-dismissed');
        chatCardClose.hidden = false;
        chatComposeInput.value = '';
        setSheetOpen(false);
      }
    };

    askTarget.addEventListener('click', () => setChatOpen(true));
    chatBack.addEventListener('click', () => {
      setChatOpen(false);
      intersectionTarget.focus();
    });

    chatCardClose.addEventListener('click', () => {
      chatPage.classList.add('is-card-dismissed');
      window.setTimeout(() => { chatCardClose.hidden = true; }, 220);
    });

    chatSuggestionTarget.addEventListener('click', () => {
      chatComposeInput.value = '楼层费和停车距离一般怎么收费？';
      chatComposeInput.dispatchEvent(new Event('input', { bubbles: true }));
    });

    const setProfileOpen = (open) => {
      phone.classList.toggle('is-profile-open', open);
      profilePage.setAttribute('aria-hidden', String(!open));
      profilePage.inert = !open;
      if (open) setSheetOpen(false);
    };

    profileTarget.addEventListener('click', () => setProfileOpen(true));
    profileBack.addEventListener('click', () => {
      setProfileOpen(false);
      intersectionTarget.focus();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && phone.classList.contains('is-sheet-open')) {
        setSheetOpen(false);
        intersectionTarget.focus();
      } else if (event.key === 'Escape' && phone.classList.contains('is-chat-open')) {
        setChatOpen(false);
        intersectionTarget.focus();
      } else if (event.key === 'Escape' && phone.classList.contains('is-profile-open')) {
        setProfileOpen(false);
        intersectionTarget.focus();
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data === 'restart-poke-guide') startGuide();
    });

    window.addEventListener('load', () => {
      window.setTimeout(startGuide, 420);
    }, { once: true });
  </script>
</body>
</html>
